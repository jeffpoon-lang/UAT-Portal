<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>搵唔到呢一頁 · UAT Portal</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#fafafa;color:#18181b;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang HK","PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans HK","Noto Sans TC",sans-serif;
      -webkit-font-smoothing:antialiased}
    main{width:100%;max-width:420px;text-align:center}
    .code{display:inline-block;margin-bottom:16px;padding:2px 8px;border-radius:6px;background:#f4f4f5;color:#52525b;font:600 12px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em}
    .en{margin:4px 0 0;color:#71717a;font-size:14px}
    p.body{margin:16px 0 28px;color:#52525b;font-size:15px;line-height:1.6}
    a{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:8px;background:#4f46e5;color:#fff;font-size:14px;font-weight:500;text-decoration:none}
    a:hover{background:#4338ca}
    a:focus-visible{outline:2px solid #4f46e5;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <span class="code">404</span>
    <h1>搵唔到呢一頁</h1>
    <p class="en">Page not found</p>
    <p class="body">條連結可能打錯咗，或者呢一頁已經唔存在。</p>
    <a href="/">返回主頁</a>
  </main>
</body>
</html>
