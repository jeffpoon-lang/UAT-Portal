# Render Blueprint（免費版）：Docker web service，database 用外面嘅 Postgres（例如 Neon）
# 喺 Render dashboard 填：DATABASE_URL、RAILS_MASTER_KEY、ADMIN_EMAIL、ADMIN_PASSWORD
# 截圖存入 Postgres（active_storage_db），所以唔使永久 disk
services:
  - type: web
    name: uat-portal
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
